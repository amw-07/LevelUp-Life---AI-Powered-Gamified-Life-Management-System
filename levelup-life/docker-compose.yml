version: "3.9"
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: levelup_db
      POSTGRES_USER: levelup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levelup_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levelup"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://levelup:${POSTGRES_PASSWORD:-levelup_dev}@postgres/levelup_db
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  celery_worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes: [./backend:/app]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://levelup:${POSTGRES_PASSWORD:-levelup_dev}@postgres/levelup_db
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on: [postgres, redis, backend]

  celery_beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info
    volumes: [./backend:/app]
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on: [redis]

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes: [./frontend:/app, /app/node_modules]
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000

volumes:
  postgres_data:
